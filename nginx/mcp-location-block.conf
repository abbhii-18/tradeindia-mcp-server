      "id": "5623b368-aa59-4340-885d-bbc63ec926db",
      "name": "HTTP Request"
    },
    {
      "parameters": {
        "jsCode": "const raw = $json.data;\n\nconst leads = JSON.parse(raw);\n\nconst clean = (value) => {\n  return (value ?? '')\n    .toString()\n    .replace(/<[^>]*>/g, '')\n    .replace(/[\\r\\n\\t]+/g, ' ')\n    .replace(/\\\\/g, '')\n    .replace(/\"/g, \"'\")\n    .replace(/\\s+/g, ' ')\n    .trim();\n};\n\nreturn leads.map(lead => ({\n  json: {\n    name: clean(lead.sender_name),\n    company: clean(lead.sender_co),\n    email: clean(lead.sender_email),\n    mobile: clean(lead.sender_mobile).replace(/[^\\d+]/g, ''),\n    other_mobiles: clean(lead.sender_other_mobiles).replace(/[^\\d+]/g, ''),\n    address: clean(lead.address),\n    city: clean(lead.sender_city),\n    state: clean(lead.sender_state),\n    country: clean(lead.sender_country) || 'India',\n    message: clean(lead.message),\n    product_name: clean(lead.product_name),\n    rfi_id: clean(lead.rfi_id),\n    source: clean(lead.source)\n  }\n}));"
      },
      "type": "n8n-nodes-base.code",
      "typeVersion": 2,
      "position": [
