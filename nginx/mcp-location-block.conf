        0
      ],
      "id": "314f2b7f-c8bc-40cf-9717-98183bb1fabc",
      "name": "Clean Leads"
    },
    {
      "parameters": {
        "jsCode": "const allLeads = $input.all().map(item => item.json);\n\nreturn [{\n  json: {\n    leads: allLeads,\n    count: allLeads.length,\n    fetched_at: new Date().toISOString()\n  }\n}];"
      },
